<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线三维地形 · MapCloud Tiler</title>
  <link rel="stylesheet" href="/static/vendor/cesium/Widgets/widgets.css">
  <style>
    *{box-sizing:border-box}html,body,#terrain-viewer{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:system-ui,sans-serif;background:#13231f;color:#eef4ed}.toolbar{position:absolute;z-index:2;top:16px;left:16px;max-width:460px;padding:16px;border:1px solid #ffffff30;border-radius:12px;background:#152822ee;box-shadow:0 6px 28px #0004}.toolbar h1{font-size:18px;margin:0 0 8px}.toolbar p{font-size:13px;line-height:1.6;margin:6px 0;color:#d2e1d7}.buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button,a{font:inherit;color:#f3f8f4;border:1px solid #8aa795;border-radius:7px;background:#294d3c;padding:7px 12px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e6bf74;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}#terrain-error{color:#ffd6bd}details{font-size:12px;line-height:1.5;margin-top:10px;max-height:160px;overflow:auto}summary{cursor:pointer;color:#d2e1d7}@media(max-width:600px){.toolbar{left:8px;right:8px;top:8px;padding:12px;max-width:none}.toolbar h1{font-size:16px}.toolbar p{font-size:12px}details{max-height:90px}.cesium-viewer-bottom{max-width:95%}}
  </style>
  <style>
    .elevation-legend{margin-top:12px;font-size:12px;color:#d2e1d7}.elevation-ramp{height:10px;border-radius:3px;margin:6px 0;background:linear-gradient(to right,#173d75 0%,#2f8658 16.667%,#a88b54 41.667%,#f4f4ed 100%)}.elevation-labels{position:relative;height:16px;font-size:11px}.elevation-labels span{position:absolute}.elevation-labels span:nth-child(2){left:16.667%;transform:translateX(-50%)}.elevation-labels span:nth-child(3){left:41.667%;transform:translateX(-50%)}.elevation-labels span:last-child{right:0}
  </style>
</head>
<body>
  <div id="terrain-viewer" aria-label="三维高程地形"></div>
  <section class="toolbar" aria-label="地形预览控制">
    <h1>离线三维地形</h1>
    <p id="terrain-status" role="status">正在读取已发布的本地地形…</p>
    <p id="terrain-error" role="alert" hidden></p>
    <div class="buttons"><button id="terrain-fit" disabled>回到下载范围</button><button id="terrain-world" disabled>查看全球</button><button id="terrain-color" aria-pressed="true" disabled>高程设色：开</button><a href="/">返回任务</a></div>
    <div id="elevation-legend" class="elevation-legend" aria-label="高程设色图例，单位米">高程（米） · 按源数据垂直基准<div class="elevation-ramp"></div><div class="elevation-labels"><span>≤ −1,000</span><span>0</span><span>1,500</span><span>≥ 5,000</span></div></div>
    <details><summary>数据来源与精度</summary><p>65×65 网格，用于三维展示。地形仅覆盖已下载范围及其父级；缺失数据不补造零海拔。非工程测量、航线计算数据。</p><p id="terrain-source"></p></details>
  </section>
  <script src="/static/vendor/cesium/Cesium.js"></script>
  <script src="/static/terrain-preview.js"></script>
</body>
</html>
