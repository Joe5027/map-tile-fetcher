name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-message:
    name: Commit Message
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            node scripts/validate_commit_message.mjs --range "$range"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
            node scripts/validate_commit_message.mjs --range "$range"
          else
            node scripts/validate_commit_message.mjs --commit "${{ github.sha }}"
          fi

  admin-region-tiler:
    name: Admin Region Tiler
    needs: commit-message
    runs-on: ubuntu-latest
    # Nine real browser workflows plus race checks; browser installation has
    # taken eight minutes on a hosted runner before the checks even start.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin-region-tiler

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/admin-region-tiler/go.mod
          cache-dependency-path: apps/admin-region-tiler/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/admin-region-tiler/package-lock.json

      - name: Install browser automation dependency
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium

      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install isolated region tooling
        run: |
          python -m venv .venv-region
          .venv-region/bin/python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-region.lock
          echo "REGION_PYTHON=$PWD/.venv-region/bin/python" >> "$GITHUB_ENV"

      - name: Run release preflight
        run: node ./scripts/release_preflight.mjs

      - name: Documentation contracts
        run: node ../../scripts/check_docs.mjs

      - name: Race and vet checks
        run: |
          go test -race ./...
          go vet ./...

  region-tools:
    name: Region Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/admin-region-tiler
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Test locked environment
        run: |
          python -m venv .venv-region
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv-region/Scripts/python; else PY=.venv-region/bin/python; fi
          "$PY" -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-region.lock
          "$PY" -B -m unittest discover -s scripts -p 'test_region_tools.py' -v

  packages:
    name: Native Package (${{ matrix.os }})
    needs: commit-message
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            suffix: zip
          - os: ubuntu-latest
            target: linux
            suffix: tar.gz
    defaults:
      run:
        working-directory: apps/admin-region-tiler
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/admin-region-tiler/go.mod
          cache-dependency-path: apps/admin-region-tiler/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/admin-region-tiler/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Build twice and verify native package
        run: |
          python -B scripts/build_release.py --ref HEAD --target '${{ matrix.target }}' --output-dir ../../dist/package-a
          python -B scripts/build_release.py --ref HEAD --target '${{ matrix.target }}' --output-dir ../../dist/package-b
          diff ../../dist/package-a/SHA256SUMS ../../dist/package-b/SHA256SUMS
          python -B scripts/verify_package.py ../../dist/package-a/*.${{ matrix.suffix }}
      - name: Verify Docker identity
        if: runner.os == 'Linux'
        run: python -B scripts/verify_docker.py
